name: nightly dependency check

# The dependency ranges in pyproject.toml are unpinned on purpose, so an
# upstream release can change behaviour without a commit from us. This catches
# that. It is a separate workflow rather than a condition inside ci.yml's
# matrix, because a job-level `if` has no `matrix` context to test against.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: ubuntu-latest / Python ${{ matrix.py }}
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install the unpinned ranges as they resolve today
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip list

      - name: Test suite
        shell: bash
        run: python run_tests.py

      - name: MCP protocol self-check
        shell: bash
        run: python mcp_server.py --check

      - name: Lint
        shell: bash
        run: ruff check .

# ---------------------------------------------------------------------------
# policy.local-only.yaml — the same gateway with the door shut.
#
# Use it to demo or run the product on a machine that must not talk to anyone:
#   python main.py --policy policy.local-only.yaml --provider-show
#   python main.py --policy policy.local-only.yaml "why is /var/log so big?"
#
# Needs a model server on this machine, e.g.:
#   sudo apt install ollama && ollama pull qwen2.5-coder:7b
# With no local server running the gateway refuses to answer rather than
# quietly falling back to a cloud endpoint. That refusal is the feature.
# ---------------------------------------------------------------------------

version: 1
name: local-only

# The model runs on this machine and nothing else is accepted. allow_cloud
# false is checked against the endpoint that would actually be called, so an
# SSM_BASE_URL pointing at a LAN or cloud server is refused, not trusted.
ai:
  provider: ollama
  model: qwen2.5-coder:7b
  base_url: http://127.0.0.1:11434/v1
  allow_cloud: false

# A local model is still an untrusted speaker: everything below is the normal
# boundary, tightened by hand for a machine where an agent may only read logs.
allow_executables:
  - vmstat
  - iostat

deny_paths:
  - /.aws/credentials
  - /.kube/config
  - /etc/ssl/private

read_roots:
  - /var/log
  - /tmp

# HIGH-risk reads are refused instead of prompted about, and nothing scores
# above 60 is allowed to run at all.
block_sensitive: true
max_score: 60

tech_mode:
  enabled: false
